title = "gitleaks config for OpenShift documentation"

# Use gitleaks' default rules but with documentation-specific allowlists
[extend]
useDefault = true

# Global allowlist
[allowlist]
description = "Documentation examples and test data"

# Allowlist all .adoc files in modules/ and assemblies/ directories
# These directories contain documentation with example outputs
paths = [
  '''modules/.*\.adoc$''',
  '''assemblies/.*\.adoc$''',
  '''.*-jobs/.*\.adoc$''',
  '''.*\.html$''',
]

# Allowlist by generic stop words that indicate documentation examples
stopwords = [
  "example",
  "sample",
  ".test.com",
]