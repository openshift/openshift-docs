name: Preview build (optional)

# OPTIONAL and OFF the critical path. AEM publishes production output.
# This workflow exists only to produce a throwaway HTML5/PDF preview artifact
# for offline review. It is the one piece carried over from the original
# github-pr-dita build-dita.yml, demoted from "the pipeline" to "a convenience."

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DITA_IMAGE: ghcr.io/dita-ot/dita-ot:4.4.1
  ROOT_MAP: github-pull-requests.ditamap

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build HTML5 preview
        run: |
          docker run --rm -v "$PWD":/src "$DITA_IMAGE" \
            --input="/src/${ROOT_MAP}" --output=/src/preview/html5 \
            --format=html5 --nav-toc=full

      - uses: actions/upload-artifact@v4
        with:
          name: dita-preview
          path: preview/
          retention-days: 7
