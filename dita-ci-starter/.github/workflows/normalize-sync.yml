name: Normalize and sync to AEM

# Runs after merge to a release branch. Resolves keys/conrefs/maprefs to plain
# DITA (dita2dita), then publishes the result to a `sync/<branch>` branch.
# The Adobe Git Connector watches sync/* and imports it one-way into AEM Guides,
# which keeps doing all publishing and translation exactly as it does today.
#
# AEM remains the publishing system. CI only transforms and hands off.

on:
  push:
    branches:
      - main
      - 'enterprise-4.*'   # one sync line per maintained OCP version

permissions:
  contents: write   # needed to push the sync/* branch

concurrency:
  group: sync-${{ github.ref_name }}
  cancel-in-progress: true   # a newer merge supersedes an in-flight sync

env:
  DITA_IMAGE: ghcr.io/dita-ot/dita-ot:4.4.1
  ROOT_MAP: github-pull-requests.ditamap   # <-- set to your product's root map

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install helpers
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Normalize — resolve keys, conrefs, and map references
        run: |
          docker run --rm -v "$PWD":/src "$DITA_IMAGE" \
            --input="/src/${ROOT_MAP}" --format=dita --output=/src/out/normalized

      - name: Push resolved DITA to the sync branch for the Git Connector
        env:
          GIT_SHA: ${{ github.sha }}
          GIT_REF_NAME: ${{ github.ref_name }}
        run: |
          chmod +x ci/*.sh
          ci/push-sync-branch.sh out/normalized "sync/${GIT_REF_NAME}"
