name: Publish JTBD map preview

on:
  push:
    branches:
      - OSDOCS-21105
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'ShaunaDiaz/openshift-docs'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Asciidoctor tools
        run: gem install asciidoctor asciidoctor-multipage --no-document

      - name: Configure the Pages commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build and publish the RHCL JTBD preview
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          bash scripts/publish-jtbd-maps.sh \
            --branch "$GITHUB_REF_NAME" \
            --distro rhcl
