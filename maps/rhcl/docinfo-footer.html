<style>
 #toc ul li.has-children > ul {
   display: none;
 }
 #toc ul li.has-children.open > ul {
   display: block;
 }
 .toc-toggle {
   appearance: none;
   background: transparent;
   border: 0;
   color: inherit;
   cursor: pointer;
   display: inline-block;
   font: inherit;
   line-height: 1;
   margin: 0 4px 0 0;
   padding: 2px 4px;
   user-select: none;
   vertical-align: middle;
 }
 .toc-toggle:focus-visible {
   outline: 2px solid currentColor;
   outline-offset: 2px;
 }
 #toc li:has(> ul)::before {
   content: '▶';
   display: inline-block;
   font-size: 0.75em;
   margin-right: 4px;
   vertical-align: middle;
 }
 #toc li.has-children::before {
   content: none;
 }
</style>
<script>
 (function() {
   var storageKey = 'rhcl-jtbd-preview-open-toc-sections';

   function loadOpenSections() {
     try {
       return JSON.parse(window.localStorage.getItem(storageKey) || '{}');
     } catch (error) {
       return {};
     }
   }

   function saveOpenSections(openSections) {
     try {
       window.localStorage.setItem(storageKey, JSON.stringify(openSections));
     } catch (error) {
       // Continue to support browsers that disable local storage.
     }
   }

   function sectionKey(li, index) {
     var link = Array.prototype.find.call(li.children, function(child) {
       return child.tagName === 'A';
     });
     if (link && link.getAttribute('href')) {
       return link.getAttribute('href').split('#')[0];
     }
     return 'section-' + index;
   }

   function initializeTocToggles() {
     var openSections = loadOpenSections();
     document.querySelectorAll('#toc li').forEach(function(li, index) {
       var sublist = Array.prototype.find.call(li.children, function(child) {
         return child.tagName === 'UL';
       });
       if (!sublist) {
         return;
       }

       li.classList.add('has-children');
       sublist.id = sublist.id || 'toc-sublist-' + index;
       var key = sectionKey(li, index);

       var toggle = li.querySelector('.toc-toggle');
       if (!toggle) {
         toggle = document.createElement('button');
         toggle.className = 'toc-toggle';
         toggle.type = 'button';
         toggle.textContent = '▶';
         li.insertBefore(toggle, li.firstChild);
       }
       toggle.setAttribute('aria-controls', sublist.id);
       toggle.setAttribute('data-toc-key', key);
       var initiallyOpen = Boolean(openSections[key]);
       if (initiallyOpen) {
         li.classList.add('open');
       }
       toggle.setAttribute('aria-expanded', String(initiallyOpen));
       toggle.setAttribute('aria-label', initiallyOpen ? 'Collapse section' : 'Expand section');
       toggle.textContent = initiallyOpen ? '▼' : '▶';

       if (toggle.dataset.tocBound === 'true') {
         return;
       }
       toggle.dataset.tocBound = 'true';
       toggle.addEventListener('click', function() {
         var open = li.classList.toggle('open');
         if (open) {
           openSections[key] = true;
         } else {
           delete openSections[key];
         }
         saveOpenSections(openSections);
         toggle.textContent = open ? '▼' : '▶';
         toggle.setAttribute('aria-expanded', String(open));
         toggle.setAttribute('aria-label', open ? 'Collapse section' : 'Expand section');
       });
     });
   }

   // The shared footer is emitted after the TOC, so initialize immediately.
   // The ready-state fallback also covers consumers that move this fragment.
   initializeTocToggles();
   if (document.readyState === 'loading') {
     document.addEventListener('DOMContentLoaded', initializeTocToggles, { once: true });
   }
 })();
</script>
