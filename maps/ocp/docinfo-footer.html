<style>
  #toc ul li.has-children > ul {
    display: none;
  }
  #toc ul li.has-children.open > ul {
    display: block;
  }
  .toc-toggle {
    cursor: pointer;
    margin-right: 4px;
    font-size: 0.75em;
    user-select: none;
    display: inline-block;
    transition: transform .15s ease;
  }
  }
</style>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    var STORAGE_KEY = 'navmap-toc-state';
    var state;
    try { state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    catch(e) { state = {}; }

    var currentPage = location.pathname.split('/').pop();

    document.querySelectorAll('#toc li').forEach(function(li) {
      var sublist = li.querySelector(':scope > ul');
      if (!sublist) return;

      li.classList.add('has-children');
      var toggle = document.createElement('span');
      toggle.className = 'toc-toggle';
      toggle.textContent = '\u25B6';

      var link = li.querySelector(':scope > a');
      var key = link ? link.getAttribute('href').split('#')[0] : '';

      var isCurrentSection = false;
      li.querySelectorAll('a[href]').forEach(function(a) {
        if (a.getAttribute('href').split('#')[0] === currentPage) {
          isCurrentSection = true;
        }
      });

      if (state[key] === true || isCurrentSection) {
        li.classList.add('open');
        toggle.classList.add('open');
        toggle.textContent = '\u25BC';
        if (isCurrentSection) { state[key] = true; }
      }

      li.insertBefore(toggle, li.firstChild);
      toggle.addEventListener('click', function() {
        var expanded = li.classList.toggle('open');
        toggle.classList.toggle('open', expanded);
        toggle.textContent = expanded ? '\u25BC' : '\u25B6';
        state[key] = expanded;
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
        catch(e) {}
      });
    });

    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch(e) {}

    /* --- Scroll current page into view in the TOC --- */
    var toc = document.getElementById('toc');
    if (toc) {
      var cur = toc.querySelector('a[href="' + currentPage + '"]');
      if (!cur) { cur = toc.querySelector('a[href$="/' + currentPage + '"]'); }
      if (cur) {
        cur.style.fontWeight = 'bold';
        /* Defer scroll so the browser's own scroll-restore runs first */
        requestAnimationFrame(function() {
          setTimeout(function() {
            cur.scrollIntoView({ block: 'center', behavior: 'instant' });
          }, 0);
        });
      }
    }
  });
</script>
